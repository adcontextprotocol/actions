name: 'Ladon — Review (Orchestrator)'
description: 'Runs the Ladon review flow: setup → reviewer → arbiter.'
author: 'Ad Context Protocol'

inputs:
  auto-approve:
    description: 'Whether Ladon may submit APPROVE (true or false). Set false for findings without approving reviews; blocking findings and escalations fail the action.'
    required: false
    default: 'false'
  anthropic-api-key:
    description: 'Anthropic API key'
    required: true
  client-id:
    description: 'GitHub App client ID for the Ladon app'
    required: false
  app-id:
    description: 'GitHub App ID for the Ladon app'
    required: false
    deprecationMessage: 'Use client-id instead'
  app-private-key:
    description: 'GitHub App private key for the Ladon app'
    required: true
  model:
    description: 'Claude model (default claude-sonnet-4-6)'
    required: false
    default: 'claude-sonnet-4-6'
  reviewer-max-turns:
    description: 'Max agentic turns for the reviewer'
    required: false
    default: '60'
  protected-branches:
    description: 'Override LADON.md ## Protected Branches'
    required: false
    default: ''
  no-auto-approve-teams:
    description: 'Override LADON.md ## No-Auto-Approve Teams'
    required: false
    default: ''
  escalation-reviewers:
    description: 'Override LADON.md ## Escalation Reviewers (comma-separated users and/or org/team-slug)'
    required: false
    default: ''
  high-risk-paths:
    description: 'Override LADON.md ## High-Risk Paths'
    required: false
    default: ''
  gated-paths:
    description: 'Override LADON.md ## Gated Paths'
    required: false
    default: ''
  trivial-paths:
    description: 'Override LADON.md ## Trivial Paths'
    required: false
    default: ''
  release-stack-branches:
    description: 'Override LADON.md ## Release Stack Branches'
    required: false
    default: 'release/next'
  skip-bot-authors:
    description: 'Override LADON.md ## Skip Bot Authors'
    required: false
    default: 'dependabot[bot],renovate[bot],github-actions[bot]'
  force-review-label:
    description: 'Label that forces review on draft PRs'
    required: false
    default: 'ladon/force-review'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        APP_ID: ${{ inputs.app-id }}
        AUTO_APPROVE: ${{ inputs.auto-approve }}
      run: |
        set -euo pipefail
        if [[ "$AUTO_APPROVE" != 'true' && "$AUTO_APPROVE" != 'false' ]]; then
          echo '::error::auto-approve must be exactly "true" or "false"'
          exit 1
        fi
        if [[ -z "$CLIENT_ID" && -z "$APP_ID" ]]; then
          echo "::error::Either 'client-id' or 'app-id' must be provided"
          exit 1
        fi

    - name: Mint Ladon App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id || inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    # Pin the audited action tree: an older floating setup/arbiter can ignore
    # auto-approve and write an approval before any capability check could run.
    # Update these pins explicitly when promoting a reviewed sub-action change.
    - name: Setup
      id: setup
      uses: adcontextprotocol/actions/ladon/setup@292a0da93b25c3e9ecfcf5a05763a4206c472c3a
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        ladon-bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]
        auto-approve: ${{ inputs.auto-approve }}
        protected-branches: ${{ inputs.protected-branches }}
        no-auto-approve-teams: ${{ inputs.no-auto-approve-teams }}
        escalation-reviewers: ${{ inputs.escalation-reviewers }}
        high-risk-paths: ${{ inputs.high-risk-paths }}
        gated-paths: ${{ inputs.gated-paths }}
        trivial-paths: ${{ inputs.trivial-paths }}
        release-stack-branches: ${{ inputs.release-stack-branches }}
        skip-bot-authors: ${{ inputs.skip-bot-authors }}
        force-review-label: ${{ inputs.force-review-label }}

    - name: Skip notice
      if: steps.setup.outputs.should-run != 'true'
      shell: bash
      run: |
        echo "Ladon skipped: ${{ steps.setup.outputs.skip-reason }}"
        echo "should-run=false skip-reason=${{ steps.setup.outputs.skip-reason }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Re-approve dismissed stale approval
      if: inputs.auto-approve == 'true' && steps.setup.outputs.reapprove == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        AUTO_APPROVE: ${{ inputs.auto-approve }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.setup.outputs.pr-number }}
        HEAD_SHA: ${{ steps.setup.outputs.head-sha }}
      run: |
        set -euo pipefail
        # Defense in depth if this step is reused or its condition changes.
        [[ "$AUTO_APPROVE" == 'true' ]] || exit 1
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
          --method POST \
          -f body='Re-approval: no reviewable delta since the prior approval; re-submitting after stale-review dismissal.' \
          -f event='APPROVE' \
          -f commit_id="$HEAD_SHA"

    - name: Reviewer
      if: steps.setup.outputs.should-run == 'true'
      id: reviewer
      uses: adcontextprotocol/actions/ladon/reviewer@a64a17ba369122d6b3401f614a31df7b8607f043
      with:
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        github-token: ${{ steps.app-token.outputs.token }}
        pr-number: ${{ steps.setup.outputs.pr-number }}
        head-sha: ${{ steps.setup.outputs.head-sha }}
        base-sha: ${{ steps.setup.outputs.base-sha }}
        diff-delta-path: ${{ steps.setup.outputs.diff-delta-path }}
        diff-full-path: ${{ steps.setup.outputs.diff-full-path }}
        ladon-md-body: ${{ steps.setup.outputs.ladon-md-body }}
        prior-decision: ${{ steps.setup.outputs.prior-decision }}
        active-change-requests-path: ${{ steps.setup.outputs.active-change-requests-path }}
        gated-paths: ${{ steps.setup.outputs.gated-paths }}
        gated-paths-reasons: ${{ steps.setup.outputs.gated-paths-reasons }}
        review-decision: ${{ steps.setup.outputs.review-decision }}
        model: ${{ inputs.model }}
        max-turns: ${{ inputs.reviewer-max-turns }}

    - name: Arbiter
      if: steps.setup.outputs.should-run == 'true'
      id: arbiter
      uses: adcontextprotocol/actions/ladon/arbiter@292a0da93b25c3e9ecfcf5a05763a4206c472c3a
      with:
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        github-token: ${{ steps.app-token.outputs.token }}
        ladon-bot-login: ${{ steps.app-token.outputs.app-slug }}[bot]
        auto-approve: ${{ inputs.auto-approve }}
        findings-json: ${{ steps.reviewer.outputs.findings-json }}
        ladon-md-body: ${{ steps.setup.outputs.ladon-md-body }}
        high-risk: ${{ steps.setup.outputs.high-risk }}
        high-risk-reasons: ${{ steps.setup.outputs.high-risk-reasons }}
        gated-paths: ${{ steps.setup.outputs.gated-paths }}
        gated-paths-reasons: ${{ steps.setup.outputs.gated-paths-reasons }}
        review-decision: ${{ steps.setup.outputs.review-decision }}
        escalation-reviewers: ${{ steps.setup.outputs.escalation-reviewers }}
        no-auto-approve-teams: ${{ steps.setup.outputs.no-auto-approve-teams }}
        protected-branches: ${{ steps.setup.outputs.protected-branches }}
        prior-decision: ${{ steps.setup.outputs.prior-decision }}
        active-change-requests-path: ${{ steps.setup.outputs.active-change-requests-path }}
        pr-number: ${{ steps.setup.outputs.pr-number }}
        head-sha: ${{ steps.setup.outputs.head-sha }}
        base-sha: ${{ steps.setup.outputs.base-sha }}
        diff-full-path: ${{ steps.setup.outputs.diff-full-path }}
        model: ${{ inputs.model }}

branding:
  icon: 'eye'
  color: 'blue'
