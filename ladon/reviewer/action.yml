name: 'Ladon — Reviewer'
description: 'Runs the Ladon rule set and persists findings through deterministic MCP tools.'
author: 'Ad Context Protocol'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key'
    required: true
  github-token:
    description: 'GitHub App installation token (Ladon app)'
    required: true
  pr-number:
    description: 'PR number (from setup output)'
    required: true
  head-sha:
    description: 'Head SHA (from setup output)'
    required: true
  base-sha:
    description: 'Base SHA (from setup output)'
    required: true
  diff-delta-path:
    description: 'Path to delta diff (from setup output)'
    required: true
  diff-full-path:
    description: 'Path to full diff (from setup output)'
    required: true
  ladon-md-body:
    description: 'Repo Context section of LADON.md (from setup output)'
    required: false
    default: ''
  prior-decision:
    description: 'Prior decision JSON from setup (empty string on first pass)'
    required: false
    default: ''
  gated-paths:
    description: '"true" if setup flagged gated paths (from setup output)'
    required: false
    default: 'false'
  gated-paths-reasons:
    description: 'JSON array of gated-path reasons (from setup output)'
    required: false
    default: '[]'
  review-decision:
    description: 'Raw GitHub reviewDecision (APPROVED | CHANGES_REQUESTED | REVIEW_REQUIRED | "") (from setup output)'
    required: false
    default: ''
  model:
    description: 'Claude model'
    required: false
    default: 'claude-sonnet-4-6'
  max-turns:
    description: 'Maximum agentic turns for the reviewer'
    required: false
    default: '60'

outputs:
  findings-json:
    description: 'Structured findings JSON conforming to reviewer/findings-schema.json'
    value: ${{ steps.findings.outputs.findings-json }}
  execution-file:
    description: 'Path to the archived initial Claude Code execution file'
    value: ${{ steps.inspect.outputs.execution-file }}
  finalization-retry-execution-file:
    description: 'Path to the finalization retry execution file when a retry ran'
    value: ${{ steps.finalization-retry.outputs.execution_file }}
  review-state-file:
    description: 'Path to the deterministic persisted review state'
    value: ${{ steps.prompt.outputs.review-state-path }}
  review-status:
    description: 'Deterministic review status (complete, incomplete, or needs_finalization)'
    value: ${{ steps.inspect.outputs.state-status }}
  result-subtype:
    description: 'Initial Claude Code result subtype, when available'
    value: ${{ steps.inspect.outputs.result-subtype }}

runs:
  using: 'composite'
  steps:
    - name: Assemble prompt
      id: prompt
      shell: bash
      env:
        LADON_MD_BODY: ${{ inputs.ladon-md-body }}
        PRIOR_DECISION: ${{ inputs.prior-decision }}
        GATED_PATHS: ${{ inputs.gated-paths }}
        GATED_PATHS_REASONS: ${{ inputs.gated-paths-reasons }}
        REVIEW_DECISION: ${{ inputs.review-decision }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DELTA_PATH: ${{ inputs.diff-delta-path }}
        FULL_PATH: ${{ inputs.diff-full-path }}
      run: |
        set -euo pipefail
        RULES="${{ github.action_path }}/rules"
        PROMPT_PATH="${RUNNER_TEMP}/ladon-prompt.md"
        REVIEW_STATE_PATH="${RUNNER_TEMP}/ladon-review-state-$(openssl rand -hex 16).json"
        MCP_CONFIG_PATH="${RUNNER_TEMP}/ladon-findings-mcp-$(openssl rand -hex 16).json"

        node "${{ github.action_path }}/src/state-cli.mjs" init "${REVIEW_STATE_PATH}"
        jq -n \
          --arg command "$(command -v node)" \
          --arg server "${{ github.action_path }}/src/server.mjs" \
          --arg state "${REVIEW_STATE_PATH}" \
          '{mcpServers:{ladon_findings:{command:$command,args:[$server],env:{LADON_REVIEW_STATE_PATH:$state}}}}' \
          > "${MCP_CONFIG_PATH}"
        chmod 600 "${MCP_CONFIG_PATH}"

        # The WG constitution lives in the spec repo, not here. Fetch it from
        # adcp@main at review time — the PR under review cannot mutate the rules
        # it is judged under. Fail-open: if the fetch fails, the review runs
        # without it.
        CONSTITUTION="$(curl -sf --max-filesize 1000000 https://raw.githubusercontent.com/adcontextprotocol/adcp/main/.agents/wg/constitution.md || true)"
        if [[ -z "${CONSTITUTION}" ]]; then
          echo "::warning::WG constitution could not be fetched (network error, >1MB, or empty) — reviewing without it."
        fi

        {
          cat "${RULES}/voice.md"
          printf '\n\n'
          cat "${RULES}/severity.md"
          printf '\n\n'
          cat "${RULES}/inline-comments.md"
          printf '\n\n'
          cat "${RULES}/coverage.md"
          printf '\n\n'
          cat "${RULES}/governance-gates.md"
          if [[ -n "${CONSTITUTION}" ]]; then
            printf '\n\n---\n\n## WG constitution (from adcontextprotocol/adcp@main)\n\n'
            printf '%s\n' "${CONSTITUTION}"
          fi
          if [[ "${GATED_PATHS}" == "true" ]]; then
            printf '\n\n# Gated paths matched (informational — do not comment on this fact)\n\n'
            printf 'The following changed files matched a `## Gated Paths` glob. Per governance-gates.md, do NOT post an inline comment or findings-JSON entry about this fact — the arbiter handles it.\n\n'
            echo "${GATED_PATHS_REASONS}" | jq -r '.[] | "- \(.)"'
          fi
          printf '\n\nRequired Review Status (informational only): %s\n' "${REVIEW_DECISION:-unknown}"
          if [[ -n "${LADON_MD_BODY}" ]]; then
            printf '\n\n# Repo-specific context\n\n'
            printf '%s\n' "${LADON_MD_BODY}"
          fi
          if [[ -n "${PRIOR_DECISION}" ]]; then
            PRIOR_OUTCOME=$(echo "${PRIOR_DECISION}" | jq -r '.outcome')
            PRIOR_HEAD=$(echo "${PRIOR_DECISION}" | jq -r '.head')
            FINDING_COUNT=$(echo "${PRIOR_DECISION}" | jq -r 'if .findings then (.findings | length) else 0 end')
            printf '\n\n# Subsequent review pass\n\n'
            printf 'This is not the first Ladon review of this PR. Prior outcome: **%s** (SHA: %s).\n\n' "${PRIOR_OUTCOME}" "${PRIOR_HEAD}"
            if [[ "${FINDING_COUNT}" -gt 0 ]]; then
              printf 'Prior findings (%s):\n' "${FINDING_COUNT}"
              echo "${PRIOR_DECISION}" | jq -r '.findings[]? | "- [\(.severity)] \(.file)\(if .line then ":\(.line | tostring)" else "" end) — \(.title)"'
            else
              printf 'Prior findings: none (clean pass).\n'
            fi
            printf '\n## Scope rules for this pass\n\n'
            printf '1. **New findings must come from delta files only.** The delta diff shows the files changed since the prior review. Surface new findings ONLY in those files. Do not use the full diff to hunt for issues in files absent from the delta — the full diff is for understanding context of delta changes, not for expanding your review surface.\n\n'
            printf '2. **Prior findings:** for each finding listed above, check whether its file is in the delta AND whether the issue persists. If the file is not in the delta, skip it — do not re-raise it. If the file IS in the delta and the issue is still present, you may re-surface it.\n\n'
            printf '3. **Largest-file rule applies to delta files only on this pass,** not to the full diff.\n'
          fi
          printf '\n\n# Your task — review PR #%s in %s\n\n' "${PR_NUMBER}" "${REPO}"
          printf 'Base SHA: %s\nHead SHA: %s\n\n' "${BASE_SHA}" "${HEAD_SHA}"
          printf 'The delta diff (what changed since the prior review) is at:\n  %s\n\n' "${DELTA_PATH}"
          printf 'The full PR diff (use only when you need broader context) is at:\n  %s\n\n' "${FULL_PATH}"
          printf 'Procedure:\n'
          printf '1. Read the delta diff first. Understand what changed.\n'
          printf '2. Pull the full diff only when delta context is insufficient.\n'
          printf '3. Use `gh pr view` and `gh pr diff` as needed. The checked-out workspace is pinned to the BASE SHA (%s): `Read`/`Glob`/`Grep` there show the OLD version of changed files, so treat them as base-only context. The delta and full diff files (paths above) carry the actual changes since base — rely on them to see what changed, and pair them with the base-version `Read` for surrounding context.\n' "${BASE_SHA}"
          printf '4. For every confirmed finding, first post its inline comment via `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`), then immediately persist it via `mcp__ladon_findings__record_finding`. Set `posted_inline` to whether the inline call succeeded. Do not wait until the end to reconstruct findings.\n'
          printf '5. At the end, call `mcp__ladon_findings__finalize_review` exactly once with a 1-3 sentence summary. Set `analysis_complete` to true only if all required review coverage completed; false keeps the run fail-closed. The tool state, not your final assistant text, is the review record.\n\n'
          printf 'Do NOT post a top-level PR review. Do NOT call `gh pr review`. The arbiter step handles the overall verdict.\n'
        } > "${PROMPT_PATH}"

        # Randomize the heredoc sentinel so prompt content (rule files, repo
        # context, the fetched WG constitution) cannot close the block early and
        # inject GITHUB_OUTPUT directives.
        PROMPT_EOF="AAO_SECRETARIAT_PROMPT_EOF_$(openssl rand -hex 8)"
        {
          echo "prompt<<${PROMPT_EOF}"
          cat "${PROMPT_PATH}"
          echo "${PROMPT_EOF}"
          echo "review-state-path=${REVIEW_STATE_PATH}"
          echo "mcp-config-path=${MCP_CONFIG_PATH}"
        } >> "${GITHUB_OUTPUT}"

    - name: Claude Code review
      id: claude
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '0'
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        allowed_non_write_users: fgranata
        prompt: ${{ steps.prompt.outputs.prompt }}
        # Bash grants are strictly read-only. The reviewer reads via `gh pr view`/`gh pr diff`
        # (read-only subcommands) and the diff files, and posts inline comments through the MCP
        # tool — never Bash gh writes. With ENV_SCRUB=0 the App token is present in the Bash env,
        # so NO write-capable `gh api` grant (issues, contents) is allowed: `gh api` cannot be
        # method-restricted in the allowlist, and a POST/PUT there would be a prompt-injection
        # token-exfil / repo-write path. (Comments must stay out of claude_args below — that block
        # is passed verbatim to the CLI as arguments.)
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --add-dir ${{ runner.temp }}
          --mcp-config '${{ steps.prompt.outputs.mcp-config-path }}'
          --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__ladon_findings__record_finding,mcp__ladon_findings__finalize_review,Bash(gh pr view:*),Bash(gh pr diff:*),Read,Glob,Grep"

    - name: Inspect persisted review
      id: inspect
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      env:
        REVIEW_STATE_PATH: ${{ steps.prompt.outputs.review-state-path }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        set -euo pipefail
        INSPECTION=$(node "${{ github.action_path }}/src/state-cli.mjs" inspect "${REVIEW_STATE_PATH}" "${EXECUTION_FILE}")
        NEEDS_FINALIZATION=$(jq -r '.needs_finalization' <<< "${INSPECTION}")
        STATE_STATUS=$(jq -r '.status' <<< "${INSPECTION}")
        RESULT_SUBTYPE=$(jq -r '.result_subtype // "unknown"' <<< "${INSPECTION}")
        ARCHIVED_EXECUTION_FILE=""
        if [[ -n "${EXECUTION_FILE}" && -f "${EXECUTION_FILE}" ]]; then
          ARCHIVED_EXECUTION_FILE="${RUNNER_TEMP}/ladon-initial-execution-$(openssl rand -hex 16).json"
          install -m 600 "${EXECUTION_FILE}" "${ARCHIVED_EXECUTION_FILE}"
        fi
        echo "needs-finalization=${NEEDS_FINALIZATION}" >> "${GITHUB_OUTPUT}"
        echo "state-status=${STATE_STATUS}" >> "${GITHUB_OUTPUT}"
        echo "result-subtype=${RESULT_SUBTYPE}" >> "${GITHUB_OUTPUT}"
        echo "execution-file=${ARCHIVED_EXECUTION_FILE}" >> "${GITHUB_OUTPUT}"
        echo "inspection-json=${INSPECTION}" >> "${GITHUB_OUTPUT}"
        echo "Ladon reviewer state: ${INSPECTION}"

    - name: Finalization retry
      id: finalization-retry
      if: ${{ always() && steps.inspect.outputs.needs-finalization == 'true' && steps.claude.outputs.session_id != '' }}
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      env:
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '0'
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        allowed_non_write_users: fgranata
        prompt: |
          Finalize the existing Ladon review now. Do not inspect files, run commands,
          add findings, or repeat the review. Call
          `mcp__ladon_findings__finalize_review` exactly once with a concise 1-3
          sentence summary of the completed analysis. Set `analysis_complete` true
          only if the prior session completed all required coverage; otherwise set it
          false so the review remains fail-closed. Stop immediately after the tool call.
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns 3
          --resume '${{ steps.claude.outputs.session_id }}'
          --mcp-config '${{ steps.prompt.outputs.mcp-config-path }}'
          --allowedTools "mcp__ladon_findings__finalize_review"

    - name: Emit findings JSON
      id: findings
      if: ${{ always() }}
      shell: bash
      env:
        REVIEW_STATE_PATH: ${{ steps.prompt.outputs.review-state-path }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        INITIAL_OUTCOME: ${{ steps.claude.outcome }}
        INITIAL_INSPECTION: ${{ steps.inspect.outputs.inspection-json }}
        RETRY_OUTCOME: ${{ steps.finalization-retry.outcome }}
      run: |
        set -euo pipefail

        INSPECTION=$(node "${{ github.action_path }}/src/state-cli.mjs" inspect "${REVIEW_STATE_PATH}" "${EXECUTION_FILE}" 2>/dev/null || true)
        if ! FINDINGS_JSON=$(node "${{ github.action_path }}/src/state-cli.mjs" emit "${REVIEW_STATE_PATH}" 2>/dev/null); then
          INSPECTION_JSON="${INSPECTION:-}"
          if [[ -z "${INSPECTION_JSON}" ]]; then
            INSPECTION_JSON='{}'
          fi
          STATUS=$(jq -r '.status // "invalid"' <<< "${INSPECTION_JSON}" 2>/dev/null || echo "invalid")
          SUBTYPE=$(jq -r '.result_subtype // "unknown"' <<< "${INSPECTION_JSON}" 2>/dev/null || echo "unknown")
          {
            echo "### Reviewer infrastructure failure"
            echo
            echo "Ladon did not produce a complete deterministic review record after its single finalization retry."
            echo
            echo "- State: \`${STATUS}\`"
            echo "- Model result: \`${SUBTYPE}\`"
            echo "- Initial action: \`${INITIAL_OUTCOME:-unknown}\`"
            echo "- Finalization retry: \`${RETRY_OUTCOME:-not-run}\`"
            echo
            echo "This is reviewer infrastructure failure, not a code rejection. The arbiter was not run and the PR was not approved."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Ladon reviewer infrastructure failure::No complete review record after one finalization retry (state=${STATUS}, result=${SUBTYPE}). This is not a code rejection; the arbiter is skipped and the run fails closed."
          exit 1
        fi

        FINDINGS_EOF="AAO_SECRETARIAT_FINDINGS_EOF_$(openssl rand -hex 8)"
        {
          echo "findings-json<<${FINDINGS_EOF}"
          printf '%s\n' "${FINDINGS_JSON}"
          echo "${FINDINGS_EOF}"
        } >> "${GITHUB_OUTPUT}"

        TELEMETRY_JSON="${INITIAL_INSPECTION:-}"
        if [[ -z "${TELEMETRY_JSON}" ]]; then
          TELEMETRY_JSON='{}'
        fi
        {
          echo "### Ladon reviewer completed"
          echo
          echo "- Persisted findings: $(jq -r '.findings_count // 0' <<< "${TELEMETRY_JSON}")"
          echo "- Initial model result: \`$(jq -r '.result_subtype // "unknown"' <<< "${TELEMETRY_JSON}")\`"
          echo "- Initial turns: $(jq -r '.turns // "unknown"' <<< "${TELEMETRY_JSON}")"
          echo "- Initial duration (ms): $(jq -r '.duration_ms // "unknown"' <<< "${TELEMETRY_JSON}")"
          echo "- Initial cost (USD): $(jq -r '.total_cost_usd // "unknown"' <<< "${TELEMETRY_JSON}")"
          echo "- Initial permission denials: $(jq -r '.permission_denials_count // "unknown"' <<< "${TELEMETRY_JSON}")"
          echo "- Finalization retry: \`${RETRY_OUTCOME:-not-run}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

branding:
  icon: 'search'
  color: 'blue'
